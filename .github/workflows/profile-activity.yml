name: Generate profile activity SVGs

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"
  push:
    branches:
      - feat/readme-svg-tool-stack
    paths:
      - "scripts/generate_activity.py"
      - ".github/workflows/profile-activity.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate SVG cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: unraveltao
        run: python3 scripts/generate_activity.py
      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh self-hosted activity SVGs"
            git push
          fi
